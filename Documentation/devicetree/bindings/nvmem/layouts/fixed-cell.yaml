%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/layouts/fixed-cell.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Fixed offset & size NVMEM cell

maintainers:
  - Rafał Miłecki <rafal@milecki.pl>
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

properties:
  compatible:
    oneOf:
      - const: mac-base
        description: >
          Cell with base MAC address to be used for calculating extra relative
          addresses.
          It can be stored in a plain binary format (cell length 6) or as an
          ASCII text like "00:11:22:33:44:55" (cell length 17).

  reg:
    maxItems: 1

  bits:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - minimum: 0
        maximum: 31
        description:
          Offset in bit within the address range specified by reg.
      - minimum: 1
        description:
          Size in bit within the address range specified by reg.

  byte-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    description: >
      Bitmask selecting which physical bytes within the NVMEM device region
      contribute to this cell's output. Bit N set means physical byte N
      relative to the cell's base offset is included; selected bytes are
      packed into the output buffer in ascending byte order. Byte positions
      are relative to the cell's base offset and limited to a 32-byte window.
      The highest set bit must not reference a byte beyond the device size.
      The number of set bits must not exceed the cell's logical size given by
      reg. Cannot be used together with bits. Cells using byte-mask are
      read-only; write operations are not supported.

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: mac-base
      required: [ compatible ]
    then:
      properties:
        "#nvmem-cell-cells":
          description: The first argument is a MAC address offset.
          const: 1
      required:
        - "#nvmem-cell-cells"
  - if:
      required: [ byte-mask ]
    then:
      properties:
        bits: false
      description:
        byte-mask and bits are mutually exclusive.

required:
  - reg

additionalProperties: true
